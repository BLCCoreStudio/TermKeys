name: Feature Request
description: Suggest an improvement for TermKeys.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives or workarounds.

  - type: checkboxes
    id: scope
    attributes:
      label: Contribution scope
      options:
        - label: I understand that the proprietary TermKeys implementation is not part of the public contribution surface.
          required: true
