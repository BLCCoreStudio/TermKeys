name: Public Repository Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-export:
    name: Validate public export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "LICENSE"
            "SECURITY.md"
            "CHANGELOG.md"
            "CONTRIBUTING.md"
            "PUBLIC_MANIFEST.txt"
            "scripts/install.sh"
            "scripts/uninstall.sh"
            ".github/tests/public-installer-test.sh"
            ".github/workflows/shell-validation.yml"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Required public file is missing or empty: $file"
              exit 1
            fi
          done

      - name: Enforce public whitelist
        shell: bash
        run: |
          set -euo pipefail

          LC_ALL=C sort -u PUBLIC_MANIFEST.txt > /tmp/expected-files.txt
          git ls-files | LC_ALL=C sort > /tmp/tracked-files.txt

          if ! diff -u /tmp/expected-files.txt /tmp/tracked-files.txt; then
            echo
            echo "Public repository contains files outside PUBLIC_MANIFEST.txt."
            echo "Review the export before publishing additional files."
            exit 1
          fi

      - name: Reject sensitive file types
        shell: bash
        run: |
          set -euo pipefail

          sensitive_files="$(
            find . \
              -type f \
              \( \
                -name '*.pem' \
                -o -name '*.key' \
                -o -name '*.p12' \
                -o -name '*.pfx' \
                -o -name '*.jks' \
                -o -name '*.keystore' \
                -o -name '.env' \
                -o -name '.env.*' \
              \) \
              -not -path './.git/*' \
              -print
          )"

          if [[ -n "$sensitive_files" ]]; then
            echo "Sensitive file type detected:"
            echo "$sensitive_files"
            exit 1
          fi

      - name: Restrict public scripts to approved installer tooling
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' \
            "scripts/install.sh" \
            "scripts/uninstall.sh" \
            | LC_ALL=C sort > /tmp/allowed-public-scripts.txt

          git ls-files 'scripts/*' | LC_ALL=C sort > /tmp/tracked-public-scripts.txt

          if ! diff -u /tmp/allowed-public-scripts.txt /tmp/tracked-public-scripts.txt; then
            echo
            echo "Unexpected file detected under scripts/."
            echo "Only the reviewed public installer and uninstaller are allowed in this directory."
            exit 1
          fi

          for script in scripts/install.sh scripts/uninstall.sh; do
            if [[ ! -f "$script" || -L "$script" ]]; then
              echo "Public script must be a regular non-symlink file: $script"
              exit 1
            fi
          done

      - name: Reject private implementation paths
        shell: bash
        run: |
          set -euo pipefail

          forbidden_paths=(
            "private"
            "internal"
            "dist"
            "build"
            "tests"
            "src"
            "pyproject.toml"
            "uv.lock"
          )

          for path in "${forbidden_paths[@]}"; do
            if [[ -e "$path" ]]; then
              echo "Private or non-public implementation path detected: $path"
              exit 1
            fi
          done

      - name: Public export validated
        run: |
          echo "TermKeys public export passed whitelist validation."
